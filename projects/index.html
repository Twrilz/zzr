    <script>
    // Logic Sandbox half-adder preview
    (function () {
        var state = { a: 1, b: 0 };
        var $ = function (id) { return document.getElementById(id); };
        function hot(id, v) { $(id).classList.toggle('hot', !!v); }
        function render() {
            var a = state.a, b = state.b, sum = a ^ b, carry = a & b;
            [['swA', a], ['swB', b]].forEach(function (x) {
                $(x[0]).classList.toggle('on', !!x[1]);
                $(x[0]).setAttribute('aria-checked', String(!!x[1]));
            });
            ['wA1', 'wA2', 'pA', 'pX1', 'pN1'].forEach(function (id) { hot(id, a); });
            ['wB1', 'wB2', 'pB', 'pX2', 'pN2'].forEach(function (id) { hot(id, b); });
            ['wS', 'pXo', 'pLS'].forEach(function (id) { hot(id, sum); });
            ['wC', 'pNo', 'pLC'].forEach(function (id) { hot(id, carry); });
            $('ledS').classList.toggle('on', !!sum);
            $('ledC').classList.toggle('on', !!carry);
        }
        function bind(id, key) {
            var el = $(id);
            function toggle() { state[key] ^= 1; render(); }
            el.addEventListener('click', toggle);
            el.addEventListener('keydown', function (e) {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
            });
        }
        bind('swA', 'a');
        bind('swB', 'b');
        render();
    })();
    </script>
