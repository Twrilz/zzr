<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery & Videos</title>
    <link rel="stylesheet" href="/zzr/css/styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/zzr/images/Icon.png">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="/zzr/">Home</a></li>
            <li><a href="/zzr/gallery/" class="active">Gallery</a></li>
            <li><a href="/zzr/about/">About</a></li>
            <li><a href="/zzr/contact/">Contact</a></li>
        </ul>
    </nav>

    <div class="gallery">
        <section id="images">
            <h2>Photos</h2>
            <div class="media-grid">
                <div class="media-card">
                    <a href="javascript:void(0);" onclick="openModal('/zzr/images/image1.JPG', 'Beautiful Sunset')">
                        <img src="/zzr/images/image1.JPG" alt="Beautiful Sunset">
                    </a>
                    <div class="meta">Beautiful Sunset</div>
                </div>
                <div class="media-card">
                    <a href="javascript:void(0);" onclick="openModal('/zzr/images/image2.JPG', 'Sunset')">
                        <img src="/zzr/images/image2.JPG" alt="Sunset">
                    </a>
                    <div class="meta">Sunset</div>
                </div>
                </div>
        </section>

        <section id="videos">
            <h2>Videos</h2>
            <div class="media-grid video-panel">
                <div class="media-card">
                    <a href="javascript:void(0);" onclick="openModal('/zzr/images/Videos/sunset.mp4', 'Sunset Video')">
                        <video src="/zzr/images/Videos/sunset.mp4" preload="metadata"></video>
                    </a>
                    <div class="meta">Sunset Video</div>
                </div>
                </div>
        </section>
    </div>

    <div id="lightbox-modal" class="modal">
        <div id="modal-caption" class="modal-caption"></div>
        <img id="modal-image" class="modal-content" alt="Modal Image">
        <video id="modal-video" class="modal-content" controls></video>
    </div>

    <footer class="footer">
        <p>&copy; <span class="current-year"></span> Zachary | All rights reserved.</p>
        <p>Follow me on <a href="https://www.instagram.com/_twrilz/">Instagram</a> | <a href="https://github.com/Twrilz">GitHub</a></p>
    </footer>

    <script src="/zzr/js/year.js"></script>
    <script src="/zzr/js/leaves.js"></script>
    <script src="/zzr/js/snow.js"></script>
    <script src="/zzr/js/lightbox.js"></script>
</body>
</html>
